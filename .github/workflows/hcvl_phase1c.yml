name: HCVL Phase 1C Representation-Independent Falsification
on:
  pull_request:
  workflow_dispatch:

jobs:
  phase1c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip numpy pytest
      - name: Verify Phase 1C frozen preregistration
        run: python scripts/verify_phase1c.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Run Phase 1C confirmatory experiment
        run: python run_phase1c.py
      - name: Upload Phase 1C results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcvl-phase1c-results
          path: |
            results/phase1c_seed_results.csv
            results/phase1c_summary.json
