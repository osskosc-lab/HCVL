name: HCVL Phase 1
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip numpy pytest
      - name: Verify frozen preregistration
        run: python scripts/verify_phase1.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Run Phase 1 confirmatory experiment
        run: python run_phase1.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcvl-phase1-results
          path: |
            results/phase1_seed_results.csv
            results/phase1_summary.json
