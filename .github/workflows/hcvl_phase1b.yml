name: HCVL Phase 1B Robust Falsification
on:
  pull_request:
  workflow_dispatch:

jobs:
  phase1b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip numpy pytest
      - name: Verify Phase 1B frozen preregistration
        run: python scripts/verify_phase1b.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Run Phase 1B robust falsification
        run: python run_phase1b.py
      - name: Upload Phase 1B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcvl-phase1b-results
          path: |
            results/phase1b_seed_results.csv
            results/phase1b_summary.json
