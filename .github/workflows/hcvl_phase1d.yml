name: HCVL Phase 1D Paired Information Isolation
on:
  pull_request:
  workflow_dispatch:

jobs:
  phase1d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip numpy pytest
      - name: Verify Phase 1D frozen preregistration
        run: python scripts/verify_phase1d.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Run Phase 1D confirmatory experiment
        shell: bash
        run: |
          set +e
          python run_phase1d.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Phase 1D completed with SUPPORT."
          elif [ "$code" -eq 2 ]; then
            echo "::notice::Phase 1D completed with FALSIFIED_OR_INCONCLUSIVE; frozen gate failure is a scientific result, not a CI failure."
          else
            echo "::error::Phase 1D runner failed unexpectedly with exit code $code."
            exit "$code"
          fi
      - name: Validate Phase 1D result artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase1d_summary.json")
          if not p.exists(): raise SystemExit("missing results/phase1d_summary.json")
          d=json.loads(p.read_text())
          if d.get("decision") not in {"SUPPORT","FALSIFIED_OR_INCONCLUSIVE"}:
              raise SystemExit(f"invalid decision: {d.get('decision')!r}")
          if "gates" not in d or "failed_gates" not in d:
              raise SystemExit("summary missing gate fields")
          print("Validated Phase 1D decision:",d["decision"])
          print("Failed frozen gates:",d["failed_gates"])
          PY
      - name: Upload Phase 1D results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcvl-phase1d-results
          path: |
            results/phase1d_seed_results.csv
            results/phase1d_summary.json
